services:

  db:
    image: postgres:16
    container_name: medassist-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: medassist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - medassist-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medassist"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: medassist-api
    restart: unless-stopped

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: medassist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123
      DATABASE_URL: postgresql+psycopg://postgres:root123@db:5432/medassist

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    networks:
      - medassist-net


  web:
    build:
      context: ./backend/frontend
      dockerfile: Dockerfile

    container_name: medassist-web
    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "8081:80"

    networks:
      - medassist-net


networks:
  medassist-net:
    driver: bridge


volumes:
  postgres_data: