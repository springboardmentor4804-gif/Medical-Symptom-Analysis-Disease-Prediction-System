services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: medassist-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URL
        value: mongodb+srv://Jayanitha_S:jayan%40mo@cluster0.v9ibxko.mongodb.net/?appName=Cluster0

  # ----------------------------------------------------------------------------
  # 2. Next.js Frontend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: medassist-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install --no-package-lock --include=optional && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: medassist-backend
          property: url
